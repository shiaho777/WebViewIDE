name: CI

# CI is the merge gate for PRs into main.
# It never closes Issues — Issues close via "Fixes #N" when the PR merges.
# Required check: android-build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# Latest run wins: superseded PR runs are cancelled to save CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  android-build:
    name: android-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify committed editor bundle matches sources
        run: node tools/editor/verify.mjs
      - name: Editor policy tests (Node built-in runner, no deps)
        run: node --test tools/editor/test/*.test.mjs
      - name: Verify committed builder bundle matches sources
        run: node tools/builder/verify.mjs
      - name: Builder npm/esbuild tests (needs fflate)
        run: |
          cd tools/builder
          npm ci --no-audit --no-fund
          node --test test/*.test.mjs
      - name: Unit tests, runtime template, and debug APKs
        run: ./gradlew :app:testDebugUnitTest :runtime:testDebugUnitTest :runtime:syncRuntimeTemplate :app:assembleDebug :runtime:assembleDebug :app:assembleDebugAndroidTest --stacktrace
      - name: Spot-check template signature
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose app/src/main/assets/runtime/template.apk
      - name: Release smoke build (throwaway CI key)
        run: |
          keytool -genkeypair -keystore /tmp/ci-release.p12 -storetype PKCS12 \
            -storepass android -keypass android -alias ci -keyalg RSA -keysize 2048 \
            -validity 30 -dname "CN=CI Smoke,O=WebViewIDE,C=US"
          ./gradlew :app:assembleRelease \
            -Pandroid.injected.signing.store.file=/tmp/ci-release.p12 \
            -Pandroid.injected.signing.store.password=android \
            -Pandroid.injected.signing.key.alias=ci \
            -Pandroid.injected.signing.key.password=android --stacktrace
      - name: Upload release APK on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: webviewide-release
          path: app/build/outputs/apk/release/*.apk
